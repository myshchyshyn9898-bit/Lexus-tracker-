<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архів - Lexus Tracker PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .modern-shadow { box-shadow: 0 16px 32px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="bg-[#f4f5f8] min-h-screen text-[#1c1c1e] pb-10">

    <div class="px-4 pt-4">
        
        <!-- ШАПКА -->
        <div class="flex items-center gap-4 mb-8 pt-2">
            <a href="settings.html" class="w-10 h-10 bg-white rounded-[14px] modern-shadow flex items-center justify-center border border-gray-100 active:scale-95 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </a>
            <div>
                <h1 class="text-[22px] font-black tracking-tight leading-none">Архів місяців</h1>
                <p class="text-[11px] font-bold text-[#8e8e93] mt-1">Закриті періоди</p>
            </div>
        </div>

        <!-- СПИСОК АРХІВУ (Сюди app.js вставлятиме картки) -->
        <div id="archive-list" class="space-y-4">
            <!-- Тут з'являться збережені місяці -->
        </div>

    </div>

    <!-- ПІДКЛЮЧАЄМО СПІЛЬНИЙ БЕКЕНД/ЛОГІКУ -->
    <script src="app.js"></script>

</body>
</html>
